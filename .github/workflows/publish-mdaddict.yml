name: Publish mdaddict

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mdaddict-pypi
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release identity and license
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib
          assert os.environ['GITHUB_REF'] == 'refs/heads/main', 'Publish only from main'
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'mdaddict'
          assert project['version'] == os.environ['RELEASE_VERSION'], 'Version input differs from package metadata'
          module = ast.parse(Path('src/mdaddict/__init__.py').read_text())
          version = next(ast.literal_eval(node.value) for node in module.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          assert version == project['version'], 'Public API version differs from package metadata'
          assert isinstance(project.get('license'), str) and project['license'].strip(), 'Choose and declare the project license first'
          assert 'LICENSE' in project.get('license-files', []), 'Include LICENSE in project.license-files'
          assert Path('LICENSE').is_file() and Path('LICENSE').read_text().strip(), 'Add the chosen license text first'
          PY

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build .
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: mdaddict-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mdaddict
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdaddict-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
